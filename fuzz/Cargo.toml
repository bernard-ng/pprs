[package]
name = "pprs-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.85"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
pprs = { path = ".." }

[[bin]]
name = "lex_bytes"
path = "fuzz_targets/lex_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_bytes"
path = "fuzz_targets/parse_bytes.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "parse_generated"
path = "fuzz_targets/parse_generated.rs"
test = false
doc = false
bench = false
