[package]
name = "pprs-perf"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[features]
allocations = ["dep:stats_alloc"]

[dependencies]
pprs = { path = "../.." }
serde_json = "1.0.145"
hex = "0.4.3"
stats_alloc = { version = "0.1.10", optional = true }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[workspace]
